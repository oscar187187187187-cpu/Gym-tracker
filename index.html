<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Gym Progress Tracker</title>
    <!-- Chart.js für Visualisierungen -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --accent: #bb86fc;
            --accent-green: #03dac6;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        h1, h2, h3 {
            color: var(--accent);
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        input, textarea, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-primary);
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        button:hover { opacity: 0.85; }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background-color: var(--input-bg);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: #000;
        }

        .week-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .week-nav button { width: auto; }

        .exercise-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .exercise-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            align-items: center;
            padding: 10px;
            background-color: var(--input-bg);
            border-radius: 8px;
        }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        .status-msg {
            font-size: 14px;
            margin-top: 8px;
            color: var(--accent-green);
        }

        @media (max-width: 600px) {
            .exercise-item { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header & Groq API Key Setup -->
    <div class="card">
        <h2>🔑 API Konfiguration</h2>
        <label for="groq-key">Groq API Key (wird sicher im Browser gespeichert):</label>
        <input type="password" id="groq-key" placeholder="gsk_..." onchange="saveApiKey()">
        <div id="api-status" class="status-msg"></div>
    </div>

    <!-- AI Plan Creator (Text oder Foto) -->
    <div class="card">
        <h2>🤖 Trainingsplan per KI erstellen</h2>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('text')">Per Text</button>
            <button class="tab-btn" onclick="switchTab('photo')">Per Foto</button>
        </div>

        <div id="tab-text">
            <label for="plan-text">Füge deinen Plan als Text ein:</label>
            <textarea id="plan-text" rows="4" placeholder="z.B. Montag: Bankdrücken 3x8, Seitheben 4x12. Dienstag: Klimmzüge 3x8..."></textarea>
            <button onclick="generatePlanFromText()">Plan aus Text generieren</button>
        </div>

        <div id="tab-photo" style="display: none;">
            <label for="plan-photo">Foto deines Trainingsplans hochladen:</label>
            <input type="file" id="plan-photo" accept="image/*">
            <button onclick="generatePlanFromImage()">Plan aus Foto parsen</button>
        </div>
        <div id="ai-status" class="status-msg"></div>
    </div>

    <!-- Tracker Section -->
    <div class="card">
        <div class="week-nav">
            <button onclick="changeWeek(-1)">◀ Vorherige Woche</button>
            <h2 id="current-week-title" style="margin:0;">Woche 1</h2>
            <button onclick="changeWeek(1)">Nächste Woche ▶</button>
        </div>

        <div id="workout-editor" class="exercise-grid">
            <!-- Dynamisch generierte Übungen -->
        </div>
    </div>

    <!-- Analytics & Diagramme -->
    <div class="card">
        <h2>📊 Langzeit-Fortschritt</h2>
        <label for="chart-exercise-select">Wähle eine Übung aus:</label>
        <select id="chart-exercise-select" onchange="updateChart()">
            <!-- Dynamisch befüllt -->
        </select>
        <div class="chart-container" style="margin-top: 15px;">
            <canvas id="progressChart"></canvas>
        </div>
    </div>
</div>

<script>
    let activeWeek = 1;
    let gymData = JSON.parse(localStorage.getItem('gym_tracker_data')) || {
        plan: [],
        logs: {} // Format: { weekNum: { exerciseName: weight } }
    };
    let chartInstance = null;

    document.addEventListener("DOMContentLoaded", () => {
        const key = localStorage.getItem('groq_api_key');
        if (key) {
            document.getElementById('groq-key').value = key;
            document.getElementById('api-status').innerText = "✓ API-Key geladen";
        }
        renderTracker();
        populateExerciseSelect();
        initChart();
    });

    function saveApiKey() {
        const key = document.getElementById('groq-key').value.trim();
        localStorage.setItem('groq_api_key', key);
        document.getElementById('api-status').innerText = "✓ API-Key gespeichert";
    }

    function getApiKey() {
        const key = localStorage.getItem('groq_api_key');
        if (!key) alert("Bitte gib zuerst deinen Groq API Key ein!");
        return key;
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (tab === 'text') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-text').style.display = 'block';
            document.getElementById('tab-photo').style.display = 'none';
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-text').style.display = 'none';
            document.getElementById('tab-photo').style.display = 'block';
        }
    }

    // --- GROQ API INTEGRATION (Text & Vision) ---

    async function generatePlanFromText() {
        const apiKey = getApiKey();
        const text = document.getElementById('plan-text').value;
        if (!apiKey || !text) return;

        const status = document.getElementById('ai-status');
        status.innerText = "Groq analysiert deinen Text...";

        const prompt = `Extrahiere alle Übungen aus folgendem Trainingsplan. Antworte AUSSCHLIESSLICH im JSON-Format als einfaches Array von Strings mit den Namen der Übungen. Beispiel: ["Bankdrücken", "Klimmzüge", "Kniebeugen"]. Hier ist der Text:\n${text}`;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: prompt }],
                    response_format: { type: "json_object" }
                })
            });

            const data = await response.json();
            const content = JSON.parse(data.choices[0].message.content);
            const exercises = content.exercises || content.exercise_list || Object.values(content)[0];

            if (Array.isArray(exercises)) {
                gymData.plan = exercises;
                saveData();
                renderTracker();
                populateExerciseSelect();
                status.innerText = "✓ Trainingsplan erfolgreich erstellt!";
            }
        } catch (e) {
            status.innerText = "Fehler beim Erstellen des Plans.";
            console.error(e);
        }
    }

    async function generatePlanFromImage() {
        const apiKey = getApiKey();
        const fileInput = document.getElementById('plan-photo');
        if (!apiKey || !fileInput.files[0]) {
            alert("Bitte wähle ein Bild aus!");
            return;
        }

        const status = document.getElementById('ai-status');
        status.innerText = "Groq Vision liest dein Bild...";

        const reader = new FileReader();
        reader.readAsDataURL(fileInput.files[0]);
        reader.onload = async () => {
            const base64Image = reader.result;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.2-11b-vision-preview",
                        messages: [
                            {
                                role: "user",
                                content: [
                                    { type: "text", text: "Extrahiere alle Übungen aus diesem Bild. Antworte im JSON-Format mit einem Schlüssel 'exercises', der ein Array von Übungsnamen enthält." },
                                    { type: "image_url", image_url: { url: base64Image } }
                                ]
                            }
                        ],
                        response_format: { type: "json_object" }
                    })
                });

                const data = await response.json();
                const content = JSON.parse(data.choices[0].message.content);
                
                if (content.exercises && Array.isArray(content.exercises)) {
                    gymData.plan = content.exercises;
                    saveData();
                    renderTracker();
                    populateExerciseSelect();
                    status.innerText = "✓ Plan erfolgreich aus Foto importiert!";
                }
            } catch (e) {
                status.innerText = "Fehler beim Lesen des Bildes.";
                console.error(e);
            }
        };
    }

    // --- TRACKING LOGIK ---

    function changeWeek(delta) {
        activeWeek = Math.max(1, activeWeek + delta);
        document.getElementById('current-week-title').innerText = `Woche ${activeWeek}`;
        renderTracker();
    }

    function saveWeight(exercise, weight) {
        if (!gymData.logs[activeWeek]) gymData.logs[activeWeek] = {};
        gymData.logs[activeWeek][exercise] = parseFloat(weight) || 0;
        saveData();
        updateChart();
    }

    function renderTracker() {
        const container = document.getElementById('workout-editor');
        container.innerHTML = '';

        if (!gymData.plan || gymData.plan.length === 0) {
            container.innerHTML = '<p style="color: var(--text-secondary);">Noch kein Plan geladen. Nutze die KI oben, um einen Plan zu erstellen!</p>';
            return;
        }

        gymData.plan.forEach(ex => {
            const val = gymData.logs[activeWeek]?.[ex] || '';
            const row = document.createElement('div');
            row.className = 'exercise-item';
            row.innerHTML = `
                <div><strong>${ex}</strong></div>
                <div><input type="number" step="0.5" placeholder="Gewicht (kg)" value="${val}" onchange="saveWeight('${ex}', this.value)"></div>
                <div style="font-size: 13px; color: var(--text-secondary);">Woche ${activeWeek}</div>
            `;
            container.appendChild(row);
        });
    }

    function saveData() {
        localStorage.setItem('gym_tracker_data', JSON.stringify(gymData));
    }

    // --- DIAGRAMME (Chart.js) ---

    function populateExerciseSelect() {
        const select = document.getElementById('chart-exercise-select');
        select.innerHTML = '';
        if (gymData.plan) {
            gymData.plan.forEach(ex => {
                const opt = document.createElement('option');
                opt.value = ex;
                opt.innerText = ex;
                select.appendChild(opt);
            });
        }
        updateChart();
    }

    function initChart() {
        const ctx = document.getElementById('progressChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Gewicht (kg)',
                    data: [],
                    backgroundColor: '#bb86fc',
                    borderColor: '#bb86fc',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#333' } },
                    x: { grid: { color: '#333' } }
                }
            }
        });
    }

    function updateChart() {
        if (!chartInstance) return;
        const selectedEx = document.getElementById('chart-exercise-select').value;
        
        const weeks = Object.keys(gymData.logs).sort((a,b) => parseInt(a) - parseInt(b));
        const labels = weeks.map(w => `Woche ${w}`);
        const dataPoints = weeks.map(w => gymData.logs[w][selectedEx] || 0);

        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = dataPoints;
        chartInstance.update();
    }
</script>

</body>
</html>
