<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Gym Progress Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --accent: #bb86fc;
            --accent-green: #03dac6;
            --accent-red: #cf6679;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1, h2, h3 { color: var(--accent); margin-top: 0; }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        input, textarea, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-primary);
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
        }

        button {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        button:hover { opacity: 0.85; }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background-color: var(--input-bg);
            color: var(--text-primary);
            flex: 1;
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: #000;
        }

        .week-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--input-bg);
            padding: 10px;
            border-radius: 8px;
        }

        .week-nav button { width: auto; margin: 0; }

        .exercise-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .exercise-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 15px;
            background-color: var(--input-bg);
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .progress-positive { color: var(--accent-green); font-weight: bold; }
        .progress-negative { color: var(--accent-red); font-weight: bold; }
        .progress-neutral { color: var(--text-secondary); }

        .ai-btn {
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px;
            margin-top: 0;
            font-size: 13px;
        }

        .ai-btn:hover { background-color: var(--accent); color: #000; }

        .delete-btn {
            background-color: transparent;
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 8px;
            margin-top: 0;
        }
        .delete-btn:hover { background-color: var(--accent-red); color: #fff; }

        .motivation-box {
            grid-column: 1 / -1;
            background-color: #222;
            border-left: 3px solid var(--accent);
            padding: 10px;
            border-radius: 4px;
            font-style: italic;
            font-size: 14px;
            display: none;
            margin-top: 5px;
            color: var(--accent-green);
        }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        .status-msg {
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }
        .status-success { color: var(--accent-green); }
        .status-error { color: var(--accent-red); }

        .manual-input-group {
            display: flex;
            gap: 10px;
        }
        .manual-input-group input { margin-bottom: 0; }
        .manual-input-group button { margin-top: 0; white-space: nowrap; width: auto; }

        @media (max-width: 768px) {
            .exercise-item { 
                grid-template-columns: 1fr; 
                border-left: none;
                border-top: 4px solid var(--accent);
            }
            .manual-input-group { flex-direction: column; }
            .manual-input-group button { width: 100%; }
            .tab-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🔑 API Konfiguration</h2>
        <label for="groq-key">Groq API Key (für KI-Pläne & Motivation):</label>
        <input type="password" id="groq-key" placeholder="gsk_..." onchange="saveApiKey()">
        <div id="api-status" class="status-msg"></div>
    </div>

    <div class="card">
        <h2>📋 Trainingsplan zusammenstellen</h2>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('text')">Per Text (KI)</button>
            <button class="tab-btn" onclick="switchTab('photo')">Per Foto (KI)</button>
            <button class="tab-btn" onclick="switchTab('manual')">Manuell (Offline)</button>
        </div>

        <div id="tab-text" class="tab-content">
            <label for="plan-text">Füge deinen Plan als Text ein:</label>
            <textarea id="plan-text" rows="4" placeholder="z.B. Montag: Bankdrücken 3x8, Seitheben 4x12..."></textarea>
            <button onclick="generatePlanFromText()">Plan aus Text generieren</button>
        </div>

        <div id="tab-photo" class="tab-content" style="display: none;">
            <label for="plan-photo">Foto/Screenshot deines Plans hochladen:</label>
            <input type="file" id="plan-photo" accept="image/*">
            <button onclick="generatePlanFromImage()">Plan aus Foto parsen</button>
        </div>

        <div id="tab-manual" class="tab-content" style="display: none;">
            <label for="manual-ex-name">Übung selbst hinzufügen (ohne KI):</label>
            <div class="manual-input-group">
                <input type="text" id="manual-ex-name" placeholder="z.B. Kniebeugen (Squats)" onkeypress="if(event.key === 'Enter') addManualExercise()">
                <button onclick="addManualExercise()">Hinzufügen</button>
            </div>
        </div>

        <div id="ai-status" class="status-msg"></div>
    </div>

    <div class="card">
        <div class="week-nav">
            <button onclick="changeWeek(-1)">◀ Woche zurück</button>
            <h2 id="current-week-title" style="margin:0;">Woche 1</h2>
            <button onclick="changeWeek(1)">Woche vor ▶</button>
        </div>

        <div id="workout-editor" class="exercise-grid"></div>
        <button onclick="clearPlan()" style="background-color: var(--accent-red); margin-top: 20px;">Gesamten Plan löschen</button>
    </div>

    <div class="card">
        <h2>📊 Langzeit-Fortschritt</h2>
        <label for="chart-exercise-select">Wähle eine Übung aus:</label>
        <select id="chart-exercise-select" onchange="updateChart()"></select>
        <div class="chart-container" style="margin-top: 15px;">
            <canvas id="progressChart"></canvas>
        </div>
    </div>
</div>

<script>
    let activeWeek = 1;
    let gymData = JSON.parse(localStorage.getItem('gym_tracker_data_v2')) || { plan: [], logs: {} };
    let chartInstance = null;

    document.addEventListener("DOMContentLoaded", () => {
        const key = localStorage.getItem('groq_api_key');
        if (key) {
            document.getElementById('groq-key').value = key;
            setStatus('api-status', '✓ API-Key geladen', 'success');
        }
        renderTracker();
        populateExerciseSelect();
        initChart();
    });

    function saveApiKey() {
        const key = document.getElementById('groq-key').value.trim();
        localStorage.setItem('groq_api_key', key);
        setStatus('api-status', '✓ API-Key gespeichert', 'success');
    }

    function getApiKey() {
        const key = localStorage.getItem('groq_api_key');
        if (!key) {
            alert("Bitte gib zuerst oben deinen Groq API Key ein!");
            return null;
        }
        return key.trim();
    }

    function setStatus(elementId, text, type) {
        const el = document.getElementById(elementId);
        el.innerText = text;
        el.className = `status-msg ${type === 'success' ? 'status-success' : 'status-error'}`;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
        
        if (tabId === 'text') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-text').style.display = 'block';
        } else if (tabId === 'photo') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-photo').style.display = 'block';
        } else if (tabId === 'manual') {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('tab-manual').style.display = 'block';
        }
        setStatus('ai-status', '', 'success');
    }

    function addManualExercise() {
        const input = document.getElementById('manual-ex-name');
        const exName = input.value.trim();
        if (!exName) return;

        if (!gymData.plan.includes(exName)) {
            gymData.plan.push(exName);
            saveData();
            renderTracker();
            populateExerciseSelect();
            setStatus('ai-status', `✓ "${exName}" manuell hinzugefügt!`, 'success');
            input.value = '';
        } else {
            setStatus('ai-status', `⚠️ Die Übung existiert bereits.`, 'error');
        }
    }

    function deleteExercise(exName) {
        if(confirm(`Möchtest du "${exName}" wirklich aus dem Plan löschen?`)) {
            gymData.plan = gymData.plan.filter(ex => ex !== exName);
            saveData();
            renderTracker();
            populateExerciseSelect();
        }
    }

    function clearPlan() {
        if(confirm("ACHTUNG: Möchtest du deinen kompletten Plan und alle Gewichte löschen?")) {
            gymData = { plan: [], logs: {} };
            saveData();
            renderTracker();
            populateExerciseSelect();
            setStatus('ai-status', 'Plan wurde gelöscht.', 'success');
        }
    }

    function extractJSONArray(rawText) {
        try {
            const matchArray = rawText.match(/\[[\s\S]*\]/);
            if (matchArray) {
                const parsed = JSON.parse(matchArray[0]);
                if (Array.isArray(parsed)) return parsed;
            }
        } catch (e) {
            console.error("Regex Parsing failed:", e);
        }
        throw new Error("Konnte kein gültiges Array finden. Bitte nutze die manuelle Eingabe.");
    }

    async function generatePlanFromText() {
        const apiKey = getApiKey();
        const text = document.getElementById('plan-text').value;
        if (!apiKey || !text) return;

        setStatus('ai-status', '⏳ Groq analysiert deinen Text...', 'success');

        const prompt = `Lies diesen Trainingsplan. Gib mir AUSSCHLIESSLICH ein JSON-Array mit den reinen Namen der Übungen zurück. Beispiel: ["Bankdrücken", "Klimmzüge", "Kniebeugen"]. Schreibe absolut keinen anderen Text davor oder danach.\n\nText:\n${text}`;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "llama-3.1-70b-versatile",
                    messages: [{ role: "user", content: prompt }]
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || "API Fehler");

            const exercises = extractJSONArray(data.choices[0].message.content);

            exercises.forEach(ex => {
                if (!gymData.plan.includes(ex)) gymData.plan.push(ex);
            });
            
            saveData();
            renderTracker();
            populateExerciseSelect();
            setStatus('ai-status', `✓ ${exercises.length} Übungen erfolgreich importiert!`, 'success');
            
        } catch (e) {
            setStatus('ai-status', `⚠️ KI-Fehler: ${e.message}. Nutze bei Problemen die manuelle Eingabe (Offline).`, 'error');
        }
    }

    async function generatePlanFromImage() {
        const apiKey = getApiKey();
        const fileInput = document.getElementById('plan-photo');
        if (!apiKey || !fileInput.files[0]) {
            alert("Bitte wähle zuerst ein Bild aus!");
            return;
        }

        setStatus('ai-status', '⏳ Groq Vision liest dein Foto...', 'success');

        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.readAsDataURL(file);
        
        reader.onload = async () => {
            const base64Image = reader.result;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.2-11b-vision-preview",
                        messages: [
                            {
                                role: "user",
                                content: [
                                    { type: "text", text: "Lies das Foto dieses Trainingsplans. Gib mir AUSSCHLIESSLICH ein JSON-Array mit den reinen Namen der Übungen zurück. Beispiel: [\"Bankdrücken\", \"Klimmzüge\"]. Schreibe absolut keinen anderen Text davor oder danach, nur das Array." },
                                    { type: "image_url", image_url: { url: base64Image } }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || "Vision API Fehler");

                const exercises = extractJSONArray(data.choices[0].message.content);

                exercises.forEach(ex => {
                    if (!gymData.plan.includes(ex)) gymData.plan.push(ex);
                });

                saveData();
                renderTracker();
                populateExerciseSelect();
                setStatus('ai-status', `✓ ${exercises.length} Übungen aus Bild erkannt!`, 'success');
            } catch (e) {
                setStatus('ai-status', `⚠️ Bild-Fehler: ${e.message}. Falls die KI das Bild nicht parsen kann, nutze die manuelle Eingabe!`, 'error');
            }
        };
    }

    function changeWeek(delta) {
        activeWeek = Math.max(1, activeWeek + delta);
        document.getElementById('current-week-title').innerText = `Woche ${activeWeek}`;
        renderTracker();
    }

    function saveWeight(exercise, weight) {
        if (!gymData.logs[activeWeek]) gymData.logs[activeWeek] = {};
        gymData.logs[activeWeek][exercise] = parseFloat(weight) || 0;
        saveData();
        updateChart();
    }

    function calculateProgress(exercise) {
        if (activeWeek <= 1) return { text: "-", class: "progress-neutral", value: 0 };
        
        const currentWeight = gymData.logs[activeWeek]?.[exercise];
        const lastWeekWeight = gymData.logs[activeWeek - 1]?.[exercise];

        if (!currentWeight || !lastWeekWeight) return { text: "-", class: "progress-neutral", value: 0 };

        const diff = ((currentWeight - lastWeekWeight) / lastWeekWeight) * 100;
        const roundedDiff = diff.toFixed(1);

        if (diff > 0) return { text: `+${roundedDiff}% 📈`, class: "progress-positive", value: roundedDiff };
        if (diff < 0) return { text: `${roundedDiff}% 📉`, class: "progress-negative", value: roundedDiff };
        return { text: `±0% ➖`, class: "progress-neutral", value: roundedDiff };
    }

    async function generateMotivation(exercise, progressValue, boxId) {
        const apiKey = getApiKey();
        const motBox = document.getElementById(`mot-${boxId}`);
        if (!apiKey) return;

        motBox.style.display = 'block';
        motBox.innerText = "Groq überlegt...";

        const prompt = `Der Nutzer hat bei der Übung '${exercise}' einen Fortschritt von ${progressValue}% zur Vorwoche. Gib ihm einen extrem kurzen, knackigen, humorvollen Motivationsspruch auf Deutsch im Gym-Bro Slang. Nur 1 Satz.`;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        { role: "system", content: "Du bist ein motivierender Gym-Bro." },
                        { role: "user", content: prompt }
                    ]
                })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
                motBox.innerText = `💪 "${data.choices[0].message.content.replace(/["']/g, '')}"`;
            } else {
                motBox.innerText = "Keine Antwort erhalten.";
            }
        } catch (e) {
            motBox.innerText = "KI gerade offline.";
        }
    }

    function renderTracker() {
        const container = document.getElementById('workout-editor');
        container.innerHTML = '';

        if (!gymData.plan || gymData.plan.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Noch kein Plan vorhanden. Nutze die KI oder die manuelle Eingabe oben, um Übungen hinzuzufügen.</p>';
            return;
        }

        gymData.plan.forEach((ex, index) => {
            const val = gymData.logs[activeWeek]?.[ex] || '';
            const progress = calculateProgress(ex);
            const uniqueId = `ex-${index}`;

            const row = document.createElement('div');
            row.className = 'exercise-item';
            row.innerHTML = `
                <div><strong style="font-size: 1.1em;">${ex}</strong></div>
                <div><input type="number" step="0.5" placeholder="Gewicht in kg" value="${val}" onchange="saveWeight('${ex}', this.value)"></div>
                <div class="${progress.class}" style="text-align: center;">${progress.text}</div>
                <div><button class="ai-btn" onclick="generateMotivation('${ex}', '${progress.value}', '${uniqueId}')">AI Spruch</button></div>
                <div style="text-align: right;"><button class="delete-btn" onclick="deleteExercise('${ex}')">✖</button></div>
                <div id="mot-${uniqueId}" class="motivation-box"></div>
            `;
            container.appendChild(row);
        });
    }

    function saveData() {
        localStorage.setItem('gym_tracker_data_v2', JSON.stringify(gymData));
    }

    function populateExerciseSelect() {
        const select = document.getElementById('chart-exercise-select');
        select.innerHTML = '';
        if (gymData.plan) {
            gymData.plan.forEach(ex => {
                const opt = document.createElement('option');
                opt.value = ex;
                opt.innerText = ex;
                select.appendChild(opt);
            });
        }
        updateChart();
    }

    function initChart() {
        const ctx = document.getElementById('progressChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Gewicht in kg',
                    data: [],
                    backgroundColor: '#bb86fc',
                    borderColor: '#bb86fc',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#333' }, ticks: { color: '#a0a0a0' } },
                    x: { grid: { color: '#333' }, ticks: { color: '#a0a0a0' } }
                },
                plugins: {
                    legend: { labels: { color: '#ffffff' } }
                }
            }
        });
    }

    function updateChart() {
        if (!chartInstance) return;
        const selectedEx = document.getElementById('chart-exercise-select').value;
        if (!selectedEx) return;
        
        const weeks = Object.keys(gymData.logs).sort((a,b) => parseInt(a) - parseInt(b));
        const labels = weeks.map(w => `Woche ${w}`);
        const dataPoints = weeks.map(w => gymData.logs[w][selectedEx] || 0);

        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = dataPoints;
        chartInstance.update();
    }
</script>

</body>
</html>
