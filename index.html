<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Progression Tracker & AI Coach (Editable Forms Edition)</title>
    <style>
        /* ==========================================================================
           1. CSS VARIABLEN & GRUND-RESET
           ========================================================================== */
        :root {
            --gym-bg: #0a0a0c;
            --gym-surface: #141419;
            --gym-surface-hover: #1f1f26;
            --gym-border: #2a2a35;
            --text-primary: #e0e0e6;
            --text-secondary: #8b8b9e;
            --accent-primary: #ff3366; 
            --accent-secondary: #00e676; 
            --accent-tertiary: #2979ff; 
            --danger: #ff1744;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--gym-bg);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 15px;
            padding-bottom: 120px;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            font-weight: 700;
            color: #ffffff;
        }

        input, button, select, textarea {
            font-family: inherit;
            outline: none;
        }

        /* ==========================================================================
           2. HEADER & STATISTIKEN
           ========================================================================== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--gym-border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--accent-primary);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--gym-surface);
            border: 1px solid var(--gym-border);
            color: var(--text-primary);
            width: 45px;
            height: 45px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.4rem;
        }

        /* ==========================================================================
           3. KALENDER NAVIGATION
           ========================================================================== */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--gym-surface);
            border: 1px solid var(--gym-border);
            border-radius: 12px;
            padding: 15px 10px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-nav-week {
            background: #1a1a21;
            border: 1px solid #333;
            color: white;
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .week-picker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex: 1;
            position: relative;
        }

        #week-display-text {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent-primary);
            text-align: center;
            letter-spacing: 0.5px;
        }

        .week-picker-container input[type="week"] {
            opacity: 0;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }

        .week-stats {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* ==========================================================================
           4. WOCHEN- UND TAGES-CONTAINER
           ========================================================================== */
        .gym-tracker-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .week-card {
            background: var(--gym-surface);
            border: 1px solid var(--gym-border);
            border-radius: 12px;
            padding: 15px 10px;
        }

        .day-section {
            margin-bottom: 30px;
            padding-left: 10px;
            border-left: 4px solid var(--gym-border);
        }

        .day-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* ==========================================================================
           5. LIVE-BEARBEITBARE ÜBUNGS-FORMULARE
           ========================================================================== */
        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 15px; 
            margin-bottom: 15px;
        }

        .exercise-edit-card {
            display: flex;
            flex-direction: column; 
            gap: 10px;
            background: #131317;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2a2a35;
        }

        .form-row-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .form-row-bottom {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .exercise-edit-card textarea {
            background: #0a0a0c;
            border: 1px solid #333;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: bold;
            width: 100%;
            resize: vertical;
            min-height: 55px;
            transition: border-color 0.2s;
        }

        .exercise-edit-card input {
            background: #0a0a0c;
            border: 1px solid #333;
            color: #ffffff;
            padding: 12px 8px;
            border-radius: 8px;
            font-size: 1.15rem;
            text-align: center;
            transition: border-color 0.2s;
        }

        .exercise-edit-card textarea:focus, .exercise-edit-card input:focus {
            border-color: var(--accent-primary);
        }

        .input-ex-sets { flex: 1; min-width: 50px; }
        .input-ex-weight { flex: 1; min-width: 60px; }
        .input-ex-reps { flex: 2; min-width: 80px; } 

        .btn-delete-ex {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 55px; /* Angleichung an die Textarea */
        }

        .btn-add-new-ex {
            background: transparent;
            color: var(--accent-secondary);
            border: 2px dashed var(--accent-secondary);
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }
        
        .btn-add-new-ex:active {
            background: rgba(0, 230, 118, 0.1);
        }

        /* ==========================================================================
           7. ABSTÄNDE UND RESTLICHE BEREICHE
           ========================================================================== */
        .massive-spacer { margin-top: 250px; }

        .ai-dashboard {
            background: linear-gradient(145deg, #10141e 0%, #0a0a0f 100%);
            border: 1px solid var(--accent-tertiary);
            border-radius: 16px;
            padding: 20px;
        }
        .ai-header-title { color: var(--accent-tertiary); font-size: 1.4rem; margin-bottom: 20px; }
        .chat-window { background: #050508; border: 1px solid var(--gym-border); border-radius: 12px; height: 300px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .msg { max-width: 90%; padding: 12px 16px; border-radius: 12px; font-size: 1rem; line-height: 1.4; }
        .msg-ai { align-self: flex-start; background: rgba(41, 121, 255, 0.1); border: 1px solid rgba(41, 121, 255, 0.3); border-bottom-left-radius: 4px; color: #e0eaff; }
        .msg-user { align-self: flex-end; background: #2a2a35; border-bottom-right-radius: 4px; }
        
        .ai-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .ai-input-group input { flex: 1; background: #141419; border: 1px solid var(--gym-border); color: white; padding: 15px; border-radius: 10px; font-size: 1.1rem; }
        .btn-send, .btn-mic { background: var(--gym-surface); border: 1px solid var(--gym-border); color: white; padding: 0 20px; border-radius: 10px; font-size: 1.1rem; cursor: pointer; }
        .btn-send { background: var(--accent-tertiary); font-weight: bold; }
        .btn-analyze-growth { width: 100%; background: transparent; border: 2px dashed var(--accent-tertiary); color: var(--accent-tertiary); padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        .nuke-zone { background: #1a0505; border: 1px solid var(--danger); border-radius: 16px; padding: 25px; text-align: center; }
        .nuke-zone h3 { color: var(--danger); font-size: 1.4rem; margin-bottom: 10px; }
        .btn-nuke { background: var(--danger); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }

        .modal-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-box { background: var(--gym-surface); border: 1px solid var(--gym-border); width: 90%; max-width: 450px; border-radius: 16px; padding: 25px; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { color: var(--text-secondary); font-size: 1rem; }
        .form-group input { background: #0a0a0c; border: 1px solid #333; color: white; padding: 15px; border-radius: 8px; font-size: 1.1rem; }
        .btn-save { width: 100%; background: var(--accent-secondary); color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; margin-top: 10px; }
        .btn-close { width: 100%; background: transparent; border: none; color: var(--text-secondary); padding: 15px; font-size: 1.1rem; margin-top: 5px; }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 10000; }
        .toast { background: var(--gym-surface-hover); color: white; padding: 15px 20px; border-radius: 8px; border-left: 5px solid var(--accent-secondary); font-size: 1.1rem; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="logo-container">
            <span style="font-size: 2.2rem;">🏋️</span>
            <div class="logo-text">GymTracker</div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="UI.openSettings()">⚙️</button>
            <button class="icon-btn" onclick="GymData.exportData()">💾</button>
        </div>
    </header>

    <!-- KALENDER NAVIGATION -->
    <nav class="calendar-nav">
        <button class="btn-nav-week" onclick="UI.changeWeek(-1)">◀</button>
        <div class="week-picker-container">
            <div id="week-display-text">Lade Datum...</div>
            <input type="week" id="week-picker" onchange="UI.selectWeek(this.value)">
            <div class="week-stats" id="week-volume-display">Volumen: 0 kg</div>
        </div>
        <button class="btn-nav-week" onclick="UI.changeWeek(1)">▶</button>
    </nav>

    <!-- HAUPT-TRACKER -->
    <main id="tracker-root" class="gym-tracker-wrapper"></main>

    <div class="massive-spacer"></div>

    <!-- KI COACH -->
    <section class="ai-dashboard">
        <h2 class="ai-header-title">🧠 Gym-Mentor</h2>
        <div class="chat-window" id="chat-box"></div>
        <div class="ai-input-group">
            <button class="btn-mic" id="btn-mic" onclick="AI.toggleMic()">🎤</button>
            <input type="text" id="chat-input" placeholder="Frag nach Trainingstipps...">
            <button class="btn-send" onclick="AI.sendManualMessage()">Senden</button>
        </div>
        <button class="btn-analyze-growth" onclick="AI.triggerGrowthAnalysis()">📈 Analyse starten</button>
    </section>

    <div class="massive-spacer"></div>

    <!-- LÖSCHFAKTOR -->
    <section class="nuke-zone">
        <h3>⚠️ Gefahrenzone</h3>
        <p>Ein Klick löscht alle Trainingsdaten komplett vom Gerät.</p>
        <button class="btn-nuke" onclick="GymData.nukeEverything()">Alles löschen</button>
    </section>

    <!-- SETTINGS -->
    <div class="modal-bg" id="settings-modal">
        <div class="modal-box">
            <h3 style="margin-bottom: 20px; color: var(--accent-secondary);">Konfiguration</h3>
            <div class="form-group">
                <label>API-Key (Groq)</label>
                <input type="password" id="input-api-key" placeholder="gsk_...">
            </div>
            <div class="form-group">
                <label>Dein Fokus</label>
                <input type="text" id="input-goal" placeholder="z.B. Muskelaufbau">
            </div>
            <button class="btn-save" onclick="UI.saveSettings()">Speichern</button>
            <button class="btn-close" onclick="UI.closeSettings()">Abbrechen</button>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast-container"></div>


    <!-- ==========================================================================
         JAVASCRIPT ENGINE 
         ========================================================================== -->
    <script>
        const DAYS = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];

        function getISOWeekString(date) {
            const tempDate = new Date(date.valueOf());
            const dayNumber = (date.getDay() + 6) % 7;
            tempDate.setDate(tempDate.getDate() - dayNumber + 3);
            const firstThursday = tempDate.valueOf();
            tempDate.setMonth(0, 1);
            if (tempDate.getDay() !== 4) {
                tempDate.setMonth(0, 1 + ((4 - tempDate.getDay()) + 7) % 7);
            }
            const weekNumber = 1 + Math.ceil((firstThursday - tempDate) / 604800000);
            return `${tempDate.getFullYear()}-W${weekNumber.toString().padStart(2, '0')}`;
        }

        function getDateFromISOWeek(weekStr) {
            const [yearStr, weekNumStr] = weekStr.split('-W');
            const year = parseInt(yearStr, 10);
            const week = parseInt(weekNumStr, 10);
            const simple = new Date(year, 0, 1 + (week - 1) * 7);
            const dow = simple.getDay();
            const ISOweekStart = simple;
            if (dow <= 4) ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
            else ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
            return ISOweekStart;
        }

        function formatWeekDateRange(weekStr) {
            const start = getDateFromISOWeek(weekStr);
            const end = new Date(start);
            end.setDate(end.getDate() + 6);
            
            const formatDate = (d) => {
                const day = d.getDate().toString().padStart(2, '0');
                const month = (d.getMonth() + 1).toString().padStart(2, '0');
                const year = d.getFullYear();
                return `${day}.${month}.${year}`;
            };
            
            return `${formatDate(start)} - ${formatDate(end)}`;
        }

        class Toast {
            static show(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'toast';
                if(type === 'error') toast.style.borderLeftColor = 'var(--danger)';
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        }

        class GymData {
            static state = { workouts: {}, apiKey: "", goal: "Muskelaufbau", chatHistory: [], currentWeekStr: "" };

            static init() {
                this.state.currentWeekStr = getISOWeekString(new Date());
                const savedData = localStorage.getItem('gymTracker_data_infinite');
                
                if (savedData) {
                    try { this.state.workouts = JSON.parse(savedData); } catch(e) { this.state.workouts = {}; }
                } else {
                    this.state.workouts = {};
                }

                this.ensureWeekExists(this.state.currentWeekStr);
                
                this.state.apiKey = localStorage.getItem('gymTracker_apiKey') || "";
                this.state.goal = localStorage.getItem('gymTracker_goal') || "Muskelaufbau";
            }

            // Aggressive Copy-Logik: Auch wenn die Woche als "leer" existiert, wird kopiert
            static ensureWeekExists(weekStr) {
                let isCompletelyEmpty = true;
                
                if (!this.state.workouts[weekStr]) {
                    this.state.workouts[weekStr] = {
                        "Montag": [], "Dienstag": [], "Mittwoch": [], "Donnerstag": [], 
                        "Freitag": [], "Samstag": [], "Sonntag": []
                    };
                } else {
                    // Prüfen, ob die Woche existiert, aber 0 Übungen hat
                    DAYS.forEach(day => {
                        if (this.state.workouts[weekStr][day].length > 0) {
                            isCompletelyEmpty = false;
                        }
                    });
                }

                // Wenn die Woche leer ist, kopiere aus der Vergangenheit!
                if (isCompletelyEmpty) {
                    this.autoCopyFromLastActiveWeek(weekStr);
                }
            }

            static autoCopyFromLastActiveWeek(targetWeekStr) {
                const pastWeeks = Object.keys(this.state.workouts)
                    .filter(w => w < targetWeekStr)
                    .sort((a, b) => b.localeCompare(a)); 

                for (const pastWeek of pastWeeks) {
                    let hasData = false;
                    DAYS.forEach(day => {
                        if (this.state.workouts[pastWeek][day].length > 0) hasData = true;
                    });

                    if (hasData) {
                        DAYS.forEach(day => {
                            this.state.workouts[pastWeek][day].forEach(ex => {
                                const newId = 'ex_' + Date.now() + Math.random().toString(36).substr(2, 5);
                                this.state.workouts[targetWeekStr][day].push({
                                    id: newId,
                                    name: ex.name,
                                    sets: ex.sets,
                                    weight: ex.weight,
                                    reps: ex.reps
                                });
                            });
                        });
                        this.saveWorkouts();
                        Toast.show("Trainingsplan aus Vorwoche übernommen!", "success");
                        return; 
                    }
                }
            }

            static saveWorkouts() { localStorage.setItem('gymTracker_data_infinite', JSON.stringify(this.state.workouts)); }

            // Fügt nur ein leeres Element hinzu
            static addEmptyExercise(day) {
                const week = this.state.currentWeekStr;
                this.ensureWeekExists(week);
                
                const newEx = {
                    id: 'ex_' + Date.now(),
                    name: "",
                    sets: "",
                    weight: "",
                    reps: ""
                };
                
                this.state.workouts[week][day].push(newEx);
                this.saveWorkouts();
            }

            static updateExercise(day, id, field, value) {
                const week = this.state.currentWeekStr;
                const ex = this.state.workouts[week][day].find(e => e.id === id);
                if (ex) {
                    ex[field] = value;
                    this.saveWorkouts();
                }
            }

            static removeExercise(day, id) {
                const week = this.state.currentWeekStr;
                const arr = this.state.workouts[week][day];
                const index = arr.findIndex(ex => ex.id === id);
                if (index > -1) { arr.splice(index, 1); this.saveWorkouts(); }
            }

            static getVolumeForWeek(weekStr) {
                if(!this.state.workouts[weekStr]) return 0;
                let total = 0;
                const days = this.state.workouts[weekStr];
                for (const day in days) {
                    days[day].forEach(ex => {
                        const w = parseFloat(ex.weight) > 0 ? parseFloat(ex.weight) : 1; 
                        const s = parseInt(ex.sets) > 0 ? parseInt(ex.sets) : 1;
                        let repCalc = 0;
                        if (typeof ex.reps === 'string') {
                            const parts = ex.reps.match(/\d+/g);
                            if (parts && parts.length > 0) {
                                const sum = parts.reduce((a, b) => a + parseInt(b), 0);
                                repCalc = sum / parts.length;
                            }
                        } else {
                            repCalc = parseInt(ex.reps) || 1;
                        }
                        total += (s * w * repCalc);
                    });
                }
                return Math.round(total);
            }
        }

        class UI {
            static init() {
                this.updateWeekPickerUI();
                this.renderTracker();
            }

            static updateWeekPickerUI() {
                const weekStr = GymData.state.currentWeekStr;
                document.getElementById('week-picker').value = weekStr;
                document.getElementById('week-display-text').textContent = formatWeekDateRange(weekStr);
                
                const vol = GymData.getVolumeForWeek(weekStr);
                document.getElementById('week-volume-display').textContent = `Volumen: ${vol} kg`;
            }

            static selectWeek(weekStr) {
                if(!weekStr) return;
                GymData.state.currentWeekStr = weekStr;
                GymData.ensureWeekExists(weekStr);
                this.updateWeekPickerUI();
                this.renderTracker();
            }

            static changeWeek(offset) {
                const currentDate = getDateFromISOWeek(GymData.state.currentWeekStr);
                currentDate.setDate(currentDate.getDate() + (offset * 7));
                this.selectWeek(getISOWeekString(currentDate));
            }

            static renderTracker() {
                const root = document.getElementById('tracker-root');
                root.innerHTML = ''; 

                const weekStr = GymData.state.currentWeekStr;
                const weekData = GymData.state.workouts[weekStr];

                const weekCard = document.createElement('div');
                weekCard.className = 'week-card';

                DAYS.forEach(day => {
                    const daySec = document.createElement('div');
                    daySec.className = 'day-section';

                    const dayTitle = document.createElement('div');
                    dayTitle.className = 'day-title';
                    dayTitle.textContent = day;
                    daySec.appendChild(dayTitle);

                    const exList = document.createElement('div');
                    exList.className = 'exercise-list';
                    
                    const exercises = weekData[day] || [];
                    
                    // Jede Übung als live bearbeitbares Formular rendern
                    exercises.forEach(ex => {
                        const editCard = document.createElement('div');
                        editCard.className = 'exercise-edit-card';

                        // Reihe 1: Name und Delete Button
                        const rowTop = document.createElement('div');
                        rowTop.className = 'form-row-top';

                        const inName = document.createElement('textarea');
                        inName.placeholder = 'Übungsname (z.B. Bankdrücken)';
                        inName.value = ex.name;
                        // oninput feuert bei jedem Tastenanschlag -> speichert sofort
                        inName.oninput = (e) => { GymData.updateExercise(day, ex.id, 'name', e.target.value); };

                        const delBtn = document.createElement('button');
                        delBtn.className = 'btn-delete-ex';
                        delBtn.innerHTML = '×';
                        delBtn.onclick = () => { GymData.removeExercise(day, ex.id); this.updateWeekPickerUI(); this.renderTracker(); };

                        rowTop.appendChild(inName);
                        rowTop.appendChild(delBtn);

                        // Reihe 2: Sätze, Gewicht, Wiederholungen
                        const rowBottom = document.createElement('div');
                        rowBottom.className = 'form-row-bottom';

                        const inSets = document.createElement('input');
                        inSets.type = 'number';
                        inSets.className = 'input-ex-sets';
                        inSets.placeholder = 'Sätze';
                        inSets.value = ex.sets;
                        inSets.oninput = (e) => { GymData.updateExercise(day, ex.id, 'sets', e.target.value); this.updateWeekPickerUI(); };

                        const inWeight = document.createElement('input');
                        inWeight.type = 'number';
                        inWeight.className = 'input-ex-weight';
                        inWeight.placeholder = 'kg';
                        inWeight.value = ex.weight;
                        inWeight.oninput = (e) => { GymData.updateExercise(day, ex.id, 'weight', e.target.value); this.updateWeekPickerUI(); };
                        
                        const inReps = document.createElement('input');
                        inReps.type = 'text'; 
                        inReps.inputMode = 'text'; 
                        inReps.className = 'input-ex-reps';
                        inReps.placeholder = 'Wdh (z.B. 10-8-6)';
                        inReps.value = ex.reps;
                        inReps.oninput = (e) => { GymData.updateExercise(day, ex.id, 'reps', e.target.value); this.updateWeekPickerUI(); };

                        rowBottom.appendChild(inSets);
                        rowBottom.appendChild(inWeight);
                        rowBottom.appendChild(inReps);

                        editCard.appendChild(rowTop);
                        editCard.appendChild(rowBottom);
                        
                        exList.appendChild(editCard);
                    });

                    daySec.appendChild(exList);

                    // Button: Neue (leere) Übung hinzufügen
                    const btnAddNew = document.createElement('button');
                    btnAddNew.className = 'btn-add-new-ex';
                    btnAddNew.innerHTML = '<span>+</span> Neue Übung hinzufügen';
                    btnAddNew.onclick = () => {
                        GymData.addEmptyExercise(day);
                        this.renderTracker();
                    };

                    daySec.appendChild(btnAddNew);
                    weekCard.appendChild(daySec);
                });

                root.appendChild(weekCard);
            }
            
            static openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
            static closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
        }

        document.addEventListener('DOMContentLoaded', () => {
            GymData.init();
            UI.init();
        });
    </script>
</body>
</html>
