<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Gym Progress & AI Tracker</title>
    <!-- Chart.js Bibliothek für Visualisierungen -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --accent: #bb86fc;
            --accent-green: #03dac6;
            --accent-red: #cf6679;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        h1, h2, h3 { color: var(--accent); margin-top: 0; }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        input, textarea, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-primary);
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        button:hover { opacity: 0.85; }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background-color: var(--input-bg);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: #000;
        }

        .week-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .week-nav button { width: auto; }

        .exercise-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .exercise-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 10px;
            align-items: center;
            padding: 12px;
            background-color: var(--input-bg);
            border-radius: 8px;
        }

        .progress-positive { color: var(--accent-green); font-weight: bold; }
        .progress-negative { color: var(--accent-red); font-weight: bold; }
        .progress-neutral { color: var(--text-secondary); }

        .ai-btn {
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px;
            margin-top: 0;
            font-size: 13px;
        }

        .ai-btn:hover {
            background-color: var(--accent);
            color: #000;
        }

        .motivation-box {
            grid-column: 1 / -1;
            background-color: #222;
            border-left: 3px solid var(--accent);
            padding: 10px;
            border-radius: 4px;
            font-style: italic;
            font-size: 14px;
            display: none;
            margin-top: 5px;
        }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        .status-msg {
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }
        .status-success { color: var(--accent-green); }
        .status-error { color: var(--accent-red); }

        @media (max-width: 700px) {
            .exercise-item { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header & Groq API Key Setup -->
    <div class="card">
        <h2>🔑 API Konfiguration</h2>
        <label for="groq-key">Groq API Key (wird lokal im Browser gespeichert):</label>
        <input type="password" id="groq-key" placeholder="gsk_..." onchange="saveApiKey()">
        <div id="api-status" class="status-msg"></div>
    </div>

    <!-- AI Plan Creator (Text oder Foto) -->
    <div class="card">
        <h2>🤖 Trainingsplan per KI erstellen</h2>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('text')">Per Text</button>
            <button class="tab-btn" onclick="switchTab('photo')">Per Foto</button>
        </div>

        <div id="tab-text">
            <label for="plan-text">Füge deinen Plan als Text ein:</label>
            <textarea id="plan-text" rows="4" placeholder="z.B. Montag: Bankdrücken 3x8, Seitheben 4x12. Dienstag: Klimmzüge 3x8..."></textarea>
            <button onclick="generatePlanFromText()">Plan aus Text generieren</button>
        </div>

        <div id="tab-photo" style="display: none;">
            <label for="plan-photo">Foto deines Trainingsplans hochladen:</label>
            <input type="file" id="plan-photo" accept="image/*">
            <button onclick="generatePlanFromImage()">Plan aus Foto parsen</button>
        </div>
        <div id="ai-status" class="status-msg"></div>
    </div>

    <!-- Tracker Section -->
    <div class="card">
        <div class="week-nav">
            <button onclick="changeWeek(-1)">◀ Vorherige Woche</button>
            <h2 id="current-week-title" style="margin:0;">Woche 1</h2>
            <button onclick="changeWeek(1)">Nächste Woche ▶</button>
        </div>

        <div id="workout-editor" class="exercise-grid"></div>
    </div>

    <!-- Analytics & Diagramme -->
    <div class="card">
        <h2>📊 Langzeit-Fortschritt</h2>
        <label for="chart-exercise-select">Wähle eine Übung aus:</label>
        <select id="chart-exercise-select" onchange="updateChart()"></select>
        <div class="chart-container" style="margin-top: 15px;">
            <canvas id="progressChart"></canvas>
        </div>
    </div>
</div>

<script>
    let activeWeek = 1;
    let gymData = JSON.parse(localStorage.getItem('gym_tracker_data')) || {
        plan: [],
        logs: {}
    };
    let chartInstance = null;

    document.addEventListener("DOMContentLoaded", () => {
        const key = localStorage.getItem('groq_api_key');
        if (key) {
            document.getElementById('groq-key').value = key;
            setStatus('api-status', '✓ API-Key geladen', 'success');
        }
        renderTracker();
        populateExerciseSelect();
        initChart();
    });

    function saveApiKey() {
        const key = document.getElementById('groq-key').value.trim();
        localStorage.setItem('groq_api_key', key);
        setStatus('api-status', '✓ API-Key gespeichert', 'success');
    }

    function getApiKey() {
        const key = localStorage.getItem('groq_api_key');
        if (!key) {
            alert("Bitte gib zuerst oben deinen Groq API Key ein!");
            return null;
        }
        return key.trim();
    }

    function setStatus(elementId, text, type) {
        const el = document.getElementById(elementId);
        el.innerText = text;
        el.className = `status-msg ${type === 'success' ? 'status-success' : 'status-error'}`;
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (tab === 'text') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-text').style.display = 'block';
            document.getElementById('tab-photo').style.display = 'none';
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-text').style.display = 'none';
            document.getElementById('tab-photo').style.display = 'block';
        }
    }

    function cleanAndParseJSON(rawText) {
        let cleaned = rawText.trim();
        if (cleaned.startsWith("```json")) {
            cleaned = cleaned.replace(/^```json/, '').replace(/```$/, '');
        } else if (cleaned.startsWith("```")) {
            cleaned = cleaned.replace(/^```/, '').replace(/```$/, '');
        }
        
        const matchArray = cleaned.match(/\[[\s\S]*\]/);
        if (matchArray) return JSON.parse(matchArray[0]);

        const matchObj = cleaned.match(/\{[\s\S]*\}/);
        if (matchObj) {
            const obj = JSON.parse(matchObj[0]);
            return obj.exercises || obj.plan || Object.values(obj)[0];
        }

        return JSON.parse(cleaned);
    }

    async function generatePlanFromText() {
        const apiKey = getApiKey();
        const text = document.getElementById('plan-text').value;
        if (!apiKey || !text) return;

        setStatus('ai-status', '⏳ Groq analysiert deinen Text...', 'success');

        const prompt = `Extrahiere alle Fitness-Übungen aus folgendem Text. Gib das Ergebnis AUSSCHLIESSLICH als gültiges JSON-Array von Strings zurück, z.B. ["Bankdrücken", "Klimmzüge", "Kniebeugen"]. Schreibe keinen weiteren Text.\n\nText:\n${text}`;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: prompt }]
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || "Fehler von der Groq API");

            const exercises = cleanAndParseJSON(data.choices[0].message.content);

            if (Array.isArray(exercises) && exercises.length > 0) {
                gymData.plan = exercises;
                saveData();
                renderTracker();
                populateExerciseSelect();
                setStatus('ai-status', `✓ ${exercises.length} Übungen erfolgreich erstellt!`, 'success');
            } else {
                throw new Error("Keine Übungen im Text gefunden.");
            }
        } catch (e) {
            setStatus('ai-status', `⚠️ Fehler: ${e.message}`, 'error');
            console.error(e);
        }
    }

    async function generatePlanFromImage() {
        const apiKey = getApiKey();
        const fileInput = document.getElementById('plan-photo');
        if (!apiKey || !fileInput.files[0]) {
            alert("Bitte wähle zuerst ein Bild aus!");
            return;
        }

        setStatus('ai-status', '⏳ Groq Vision liest dein Foto...', 'success');

        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.readAsDataURL(file);
        
        reader.onload = async () => {
            const base64Image = reader.result;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.2-11b-vision-preview",
                        messages: [
                            {
                                role: "user",
                                content: [
                                    { type: "text", text: "Lies dieses Bild ab. Extrahiere alle Namen der Übungen auf dem Trainingsplan. Gib die Antwort AUSSCHLIESSLICH als gültiges JSON-Array von Strings zurück, z.B. [\"Bankdrücken\", \"Klimmzüge\"]. Schreibe absolut keinen anderen Text." },
                                    { type: "image_url", image_url: { url: base64Image } }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || "Fehler von der Groq API");

                const exercises = cleanAndParseJSON(data.choices[0].message.content);

                if (Array.isArray(exercises) && exercises.length > 0) {
                    gymData.plan = exercises;
                    saveData();
                    renderTracker();
                    populateExerciseSelect();
                    setStatus('ai-status', `✓ ${exercises.length} Übungen aus Bild erkannt!`, 'success');
                } else {
                    throw new Error("Konnte keine Übungen aus dem Bild auslesen.");
                }
            } catch (e) {
                setStatus('ai-status', `⚠️ Fehler beim Lesen des Fotos: ${e.message}`, 'error');
                console.error(e);
            }
        };

        reader.onerror = () => {
            setStatus('ai-status', '⚠️ Fehler beim Laden der Datei auf deinem Gerät.', 'error');
        };
    }

    function changeWeek(delta) {
        activeWeek = Math.max(1, activeWeek + delta);
        document.getElementById('current-week-title').innerText = `Woche ${activeWeek}`;
        renderTracker();
    }

    function saveWeight(exercise, weight) {
        if (!gymData.logs[activeWeek]) gymData.logs[activeWeek] = {};
        gymData.logs[activeWeek][exercise] = parseFloat(weight) || 0;
        saveData();
        updateChart();
    }

    function calculateProgress(exercise) {
        if (activeWeek <= 1) return { text: "-", class: "progress-neutral", value: 0 };
        
        const currentWeight = gymData.logs[activeWeek]?.[exercise];
        const lastWeekWeight = gymData.logs[activeWeek - 1]?.[exercise];

        if (!currentWeight || !lastWeekWeight) return { text: "-", class: "progress-neutral", value: 0 };

        const diff = ((currentWeight - lastWeekWeight) / lastWeekWeight) * 100;
        const roundedDiff = diff.toFixed(1);

        if (diff > 0) return { text: `+${roundedDiff}% 📈`, class: "progress-positive", value: roundedDiff };
        if (diff < 0) return { text: `${roundedDiff}% 📉`, class: "progress-negative", value: roundedDiff };
        return { text: `±0% ➖`, class: "progress-neutral", value: roundedDiff };
    }

    async function generateMotivation(exercise, progressValue, boxId) {
        const apiKey = getApiKey();
        const motBox = document.getElementById(`mot-${boxId}`);
        if (!apiKey) return;

        motBox.style.display = 'block';
        motBox.innerText = "Groq überlegt...";

        const prompt = `Der Nutzer hat bei der Übung '${exercise}' einen Fortschritt von ${progressValue}% im Vergleich zur Vorwoche gemacht. Gib ihm einen extrem kurzen, knackigen und leicht humorvollen Motivationsspruch auf Deutsch (maximal 1 Satz, im Gym-Bro Slang).`;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "Du bist ein motivierender, humorvoller Gym-Bro." },
                        { role: "user", content: prompt }
                    ],
                    max_tokens: 60
                })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
                motBox.innerText = data.choices[0].message.content;
            } else {
                motBox.innerText = "Keine Antwort erhalten.";
            }
        } catch (e) {
            motBox.innerText = "Fehler bei der KI-Generierung.";
            console.error(e);
        }
    }

    function renderTracker() {
        const container = document.getElementById('workout-editor');
        container.innerHTML = '';

        if (!gymData.plan || gymData.plan.length === 0) {
            container.innerHTML = '<p style="color: var(--text-secondary);">Noch kein Plan geladen. Nutze die KI oben, um einen Plan per Text oder Foto einzufügen!</p>';
            return;
        }

        gymData.plan.forEach((ex, index) => {
            const val = gymData.logs[activeWeek]?.[ex] || '';
            const progress = calculateProgress(ex);
            const uniqueId = `ex-${index}`;

            const row = document.createElement('div');
            row.className = 'exercise-item';
            row.innerHTML = `
                <div><strong>${ex}</strong></div>
                <div><input type="number" step="0.5" placeholder="kg" value="${val}" onchange="saveWeight('${ex}', this.value)"></div>
                <div class="${progress.class}">${progress.text}</div>
                <div><button class="ai-btn" onclick="generateMotivation('${ex}', '${progress.value}', '${uniqueId}')">AI Spruch</button></div>
                <div id="mot-${uniqueId}" class="motivation-box"></div>
            `;
            container.appendChild(row);
        });
    }

    function saveData() {
        localStorage.setItem('gym_tracker_data', JSON.stringify(gymData));
    }

    function populateExerciseSelect() {
        const select = document.getElementById('chart-exercise-select');
        select.innerHTML = '';
        if (gymData.plan) {
            gymData.plan.forEach(ex => {
                const opt = document.createElement('option');
                opt.value = ex;
                opt.innerText = ex;
                select.appendChild(opt);
            });
        }
        updateChart();
    }

    function initChart() {
        const ctx = document.getElementById('progressChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Gewicht (kg)',
                    data: [],
                    backgroundColor: '#bb86fc',
                    borderColor: '#bb86fc',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#333' } },
                    x: { grid: { color: '#333' } }
                }
            }
        });
    }

    function updateChart() {
        if (!chartInstance) return;
        const selectedEx = document.getElementById('chart-exercise-select').value;
        
        const weeks = Object.keys(gymData.logs).sort((a,b) => parseInt(a) - parseInt(b));
        const labels = weeks.map(w => `Woche ${w}`);
        const dataPoints = weeks.map(w => gymData.logs[w][selectedEx] || 0);

        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = dataPoints;
        chartInstance.update();
    }
</script>

</body>
</html>
